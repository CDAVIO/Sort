<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 460" width="1200" height="460" role="img" aria-label="SORT: photos fly from a messy pile into folders by device">
<defs>
  <radialGradient id="glow" cx="72%" cy="20%" r="60%"><stop offset="0" stop-color="#ffd905" stop-opacity=".22"/><stop offset="1" stop-color="#ffd905" stop-opacity="0"/></radialGradient>
  <linearGradient id="p1" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#7cc6f2"/><stop offset=".6" stop-color="#2f80c9"/><stop offset="1" stop-color="#1d4f2e"/></linearGradient>
  <linearGradient id="p2" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffcf8a"/><stop offset=".6" stop-color="#f0705a"/><stop offset="1" stop-color="#3a2448"/></linearGradient>
  <linearGradient id="p3" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#a8e0a0"/><stop offset=".6" stop-color="#3f9a5a"/><stop offset="1" stop-color="#264d2f"/></linearGradient>
  <linearGradient id="p4" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffd6e7"/><stop offset=".6" stop-color="#c06fae"/><stop offset="1" stop-color="#2e2a52"/></linearGradient>
  <symbol id="card" viewBox="0 0 60 60"><rect width="60" height="60" rx="11" fill="#fff"/><rect x="5" y="5" width="50" height="50" rx="7" style="fill:var(--g,url(#p1))"/><circle cx="20" cy="20" r="6" fill="#fff" opacity=".8"/><path d="M5 46 22 33l10 8 9-7 14 12v4a5 5 0 0 1-5 5H10a5 5 0 0 1-5-5z" fill="#000" opacity=".28"/></symbol>
  <symbol id="folder" viewBox="0 0 80 80"><path fill="#f2994a" d="M16 17a4 4 0 0 0-4 4v38a4 4 0 0 0 4 4h48a4 4 0 0 0 4-4V29a4 4 0 0 0-4-4H35.4c-.4 0-.7-.2-.9-.5l-4.4-6.1A4 4 0 0 0 27 17z"/><rect width="56" height="38" x="12" y="25" fill="#f2c94c" rx="4"/></symbol>
  <style>
    text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif}
    .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
    .fly{animation:6s cubic-bezier(.45,.05,.3,1) infinite both;opacity:0}
    .a{animation-name:toA}.b{animation-name:toB}.c{animation-name:toC}
    @keyframes toA{0%{opacity:0;transform:translate(0,0) rotate(-6deg) scale(1)}6%{opacity:1}22%{transform:translate(0,-6px) rotate(-6deg)}50%{transform:translate(205px,-95px) rotate(6deg) scale(1.15)}74%{opacity:1;transform:translate(410px,-14px) rotate(0) scale(.5)}78%,100%{opacity:0;transform:translate(410px,-6px) scale(.3)}}
    @keyframes toB{0%{opacity:0;transform:translate(0,0) rotate(5deg) scale(1)}6%{opacity:1}22%{transform:translate(0,-6px) rotate(5deg)}50%{transform:translate(295px,-105px) rotate(-6deg) scale(1.15)}74%{opacity:1;transform:translate(590px,-14px) rotate(0) scale(.5)}78%,100%{opacity:0;transform:translate(590px,-6px) scale(.3)}}
    @keyframes toC{0%{opacity:0;transform:translate(0,0) rotate(-3deg) scale(1)}6%{opacity:1}22%{transform:translate(0,-6px) rotate(-3deg)}50%{transform:translate(385px,-115px) rotate(5deg) scale(1.15)}74%{opacity:1;transform:translate(770px,-14px) rotate(0) scale(.5)}78%,100%{opacity:0;transform:translate(770px,-6px) scale(.3)}}
    .ring{fill:none;stroke:#ffd905;stroke-width:2;transform-box:fill-box;transform-origin:center;animation:ring 2s ease-out infinite;opacity:0}
    @keyframes ring{0%,62%{opacity:0;transform:scale(.6)}70%{opacity:.8}100%{opacity:0;transform:scale(1.5)}}
    .line{stroke-dasharray:6 8;animation:dash 1.2s linear infinite}
    @keyframes dash{to{stroke-dashoffset:-28}}
    @media (prefers-reduced-motion:reduce){.fly,.ring,.line{animation:none}.fly{opacity:0}}
  </style>
</defs>
<rect width="1200" height="460" rx="28" fill="#050505"/>
<rect width="1200" height="460" rx="28" fill="url(#glow)"/>
<text x="64" y="92" fill="#fff" font-size="54" font-weight="800" letter-spacing="-1.5">SORT</text>
<text x="66" y="128" fill="#ffd905" font-size="15" font-weight="700" letter-spacing="3">BY CDAV.IO</text>
<text x="64" y="172" fill="#a6a6a6" font-size="20">Your camera roll, in folders that make sense.</text>
<!-- the divider every file crosses -->
<line x1="64" y1="350" x2="1136" y2="350" stroke="#ffd905" stroke-opacity=".5" stroke-width="1.5" class="line"/>
<text x="64" y="380" fill="#6f6f6f" font-size="13" class="mono">where does it go?</text>
<text x="1136" y="380" fill="#6f6f6f" font-size="13" class="mono" text-anchor="end">read from each file: camera · date · place</text>
<!-- the pile -->
<g transform="translate(170 250)">
  <use href="#card" x="-10" y="20" width="62" height="62" style="--g:url(#p3)" transform="rotate(-14 20 50)"/>
  <use href="#card" x="40" y="26" width="62" height="62" style="--g:url(#p4)" transform="rotate(12 70 56)"/>
  <use href="#card" x="12" y="4" width="62" height="62" style="--g:url(#p2)" transform="rotate(-4 44 34)"/>
  <use href="#card" x="62" y="-2" width="58" height="58" style="--g:url(#p1)" transform="rotate(9 90 26)"/>
</g>
<!-- files flying to their folder -->
<g transform="translate(200 266)">
  <use href="#card" width="60" height="60" class="fly a" style="--g:url(#p1);animation-delay:0s"/>
  <use href="#card" width="60" height="60" class="fly b" style="--g:url(#p2);animation-delay:.5s"/>
  <use href="#card" width="60" height="60" class="fly c" style="--g:url(#p3);animation-delay:1s"/>
  <use href="#card" width="60" height="60" class="fly a" style="--g:url(#p4);animation-delay:1.5s"/>
  <use href="#card" width="60" height="60" class="fly b" style="--g:url(#p1);animation-delay:2s"/>
  <use href="#card" width="60" height="60" class="fly c" style="--g:url(#p2);animation-delay:2.5s"/>
  <use href="#card" width="60" height="60" class="fly a" style="--g:url(#p3);animation-delay:3s"/>
  <use href="#card" width="60" height="60" class="fly b" style="--g:url(#p4);animation-delay:3.5s"/>
  <use href="#card" width="60" height="60" class="fly c" style="--g:url(#p1);animation-delay:4s"/>
  <use href="#card" width="60" height="60" class="fly a" style="--g:url(#p2);animation-delay:4.5s"/>
  <use href="#card" width="60" height="60" class="fly b" style="--g:url(#p3);animation-delay:5s"/>
  <use href="#card" width="60" height="60" class="fly c" style="--g:url(#p4);animation-delay:5.5s"/>
</g>
<!-- the folders -->
<g>
  <circle cx="640" cy="286" r="46" class="ring" style="animation-delay:.4s"/>
  <use href="#folder" x="598" y="244" width="84" height="84"/>
  <text x="640" y="342" fill="#f3f3f3" font-size="14" text-anchor="middle" class="mono">iPhone 16 Pro Max</text>
  <circle cx="820" cy="286" r="46" class="ring" style="animation-delay:1.1s"/>
  <use href="#folder" x="778" y="244" width="84" height="84"/>
  <text x="820" y="342" fill="#f3f3f3" font-size="14" text-anchor="middle" class="mono">Canon EOS R6</text>
  <circle cx="1000" cy="286" r="46" class="ring" style="animation-delay:1.8s"/>
  <use href="#folder" x="958" y="244" width="84" height="84"/>
  <text x="1000" y="342" fill="#f3f3f3" font-size="14" text-anchor="middle" class="mono">DJI Osmo Pocket 2</text>
</g>
<text x="64" y="424" fill="#8a8a8a" font-size="15">Free for macOS and Windows · no account · your photos never leave your computer</text>
</svg>
