<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 380" width="1200" height="380" role="img" aria-label="SORT finds the same photo twice: the iPhone original stays, the smaller WhatsApp copy goes to a Duplicates folder">
<defs>
  <radialGradient id="glow" cx="70%" cy="10%" r="65%"><stop offset="0" stop-color="#ffd905" stop-opacity=".18"/><stop offset="1" stop-color="#ffd905" stop-opacity="0"/></radialGradient>
  <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffcf8a"/><stop offset=".6" stop-color="#f0705a"/><stop offset="1" stop-color="#3a2448"/></linearGradient>
  <clipPath id="ph1"><rect x="0" y="0" width="150" height="150" rx="12"/></clipPath>
  <symbol id="photo" viewBox="0 0 160 160">
    <rect width="160" height="160" rx="18" fill="#fff"/>
    <g transform="translate(5 5)" clip-path="url(#ph1)">
      <rect width="150" height="150" fill="url(#sky)"/>
      <circle cx="48" cy="44" r="15" fill="#fff" opacity=".85"/>
      <path d="M0 150V110l42-30 34 26 30-22 44 34v32z" fill="#000" opacity=".3"/>
    </g>
  </symbol>
  <symbol id="folder" viewBox="0 0 80 80"><path fill="#f2994a" d="M16 17a4 4 0 0 0-4 4v38a4 4 0 0 0 4 4h48a4 4 0 0 0 4-4V29a4 4 0 0 0-4-4H35.4c-.4 0-.7-.2-.9-.5l-4.4-6.1A4 4 0 0 0 27 17z"/><rect width="56" height="38" x="12" y="25" fill="#f2c94c" rx="4"/></symbol>
  <style>
    text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif}
    .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
    /* 6 s loop: scan, match, the copy flies into Duplicates, the result shows */
    .scan{animation:scan 6s ease-in-out infinite}
    @keyframes scan{0%{transform:translateX(0);opacity:0}6%{opacity:.9}30%{transform:translateX(520px);opacity:.9}36%,100%{transform:translateX(520px);opacity:0}}
    .match{opacity:0;animation:match 6s ease-out infinite}
    @keyframes match{0%,30%{opacity:0}36%,62%{opacity:1}68%,100%{opacity:0}}
    .tagk{opacity:0;animation:tag 6s ease-out infinite}
    .tagd{opacity:0;animation:tag 6s ease-out infinite}
    @keyframes tag{0%,34%{opacity:0;transform:translateY(6px)}40%,92%{opacity:1;transform:none}100%{opacity:0}}
    .fly{animation:fly 6s cubic-bezier(.45,.05,.3,1) infinite}
    @keyframes fly{0%,52%{transform:translate(0,0) scale(1);opacity:1}70%{transform:translate(260px,-70px) scale(.75);opacity:1}82%{transform:translate(538px,30px) scale(.32);opacity:1}86%,94%{transform:translate(538px,30px) scale(.32);opacity:0}100%{transform:translate(0,0) scale(1);opacity:0}}
    .ring{fill:none;stroke:#ffd905;stroke-width:2.5;opacity:0;transform-box:fill-box;transform-origin:center;animation:ring 6s ease-out infinite}
    @keyframes ring{0%,80%{opacity:0;transform:scale(.6)}84%{opacity:.9}100%{opacity:0;transform:scale(1.6)}}
    .done{opacity:0;animation:done 6s ease-out infinite}
    @keyframes done{0%,84%{opacity:0}88%,98%{opacity:1}100%{opacity:0}}
    @media (prefers-reduced-motion:reduce){.scan,.match,.tagk,.tagd,.fly,.ring,.done{animation:none}.tagk,.tagd,.done{opacity:1}}
  </style>
</defs>
<rect width="1200" height="380" rx="28" fill="#050505"/>
<rect width="1200" height="380" rx="28" fill="url(#glow)"/>
<text x="60" y="66" fill="#fff" font-size="28" font-weight="800" letter-spacing="-.6">Same photo twice? SORT finds it.</text>
<text x="60" y="96" fill="#9a9a9a" font-size="15">Even the smaller copy WhatsApp sent back. No AI, nothing leaves your computer.</text>

<!-- the original -->
<g transform="translate(70 150)">
  <use href="#photo" width="160" height="160"/>
  <g class="tagk"><rect x="8" y="8" width="64" height="24" rx="12" fill="#2f9c72"/><text x="40" y="25" fill="#fff" font-size="12.5" font-weight="700" text-anchor="middle">Keep</text></g>
  <text x="0" y="186" fill="#f3f3f3" font-size="14" font-weight="600" class="mono">IMG_0001.HEIC</text>
  <text x="0" y="206" fill="#7a7a7a" font-size="12.5">iPhone 16 Pro Max · 4032×3024 · 2.4 MB</text>
</g>

<!-- the WhatsApp copy, smaller -->
<g transform="translate(340 180)">
  <g class="fly">
    <use href="#photo" width="120" height="120"/>
    <g class="tagd"><rect x="6" y="6" width="86" height="22" rx="11" fill="#ffd905"/><text x="49" y="21.5" fill="#111" font-size="11.5" font-weight="700" text-anchor="middle">Duplicate</text></g>
  </g>
  <text x="0" y="156" fill="#f3f3f3" font-size="14" font-weight="600" class="mono">IMG-20261108-WA0001.jpg</text>
  <text x="0" y="176" fill="#7a7a7a" font-size="12.5">WhatsApp copy · 1600×1200 · 210 KB</text>
</g>

<!-- the scan line and the match -->
<rect x="60" y="140" width="4" height="190" rx="2" fill="#ffd905" class="scan"/>
<g class="match">
  <path d="M236 230 C 280 200, 300 200, 336 232" fill="none" stroke="#ffd905" stroke-width="2" stroke-dasharray="6 6"/>
  <rect x="246" y="186" width="80" height="24" rx="12" fill="#1a1a1a" stroke="#ffd905" stroke-opacity=".6"/>
  <text x="286" y="202.5" fill="#ffd905" font-size="12" font-weight="700" text-anchor="middle" class="mono">same 98%</text>
</g>

<!-- the Duplicates folder -->
<g transform="translate(830 170)">
  <circle cx="60" cy="58" r="56" class="ring"/>
  <use href="#folder" x="0" y="0" width="120" height="120"/>
  <text x="60" y="140" fill="#f3f3f3" font-size="14" font-weight="600" text-anchor="middle" class="mono">Duplicates</text>
  <text x="60" y="160" fill="#7a7a7a" font-size="12.5" text-anchor="middle">or the Trash, in the app</text>
</g>

<g class="done">
  <circle cx="1098" cy="66" r="15" fill="#ffd905"/>
  <path d="M1091 66l5 5 9-10" fill="none" stroke="#111" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="1074" y="72" fill="#ffd905" font-size="15" font-weight="700" text-anchor="end">1 copy moved · 210 KB freed · the original stayed</text>
</g>
</svg>
