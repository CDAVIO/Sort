<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Page not found | SORT by CDAV.IO</title>
<style>
:root{
  color-scheme:dark;
  --paper:#000; --ink:#f3f3f3; --ink2:#a6a6a6; --ink3:#6f6f6f;
  --rule:#272727; --rule2:#3a3a3a; --brand:#ffd905; --on-brand:#111;
  --glow:rgba(255,217,5,.05);
}
@media(prefers-color-scheme:light){
  :root{ color-scheme:light; --paper:#fff; --ink:#15140f; --ink2:#5a5a55; --ink3:#8a8a84;
         --rule:#e8e8e3; --rule2:#d8d8d2; --glow:rgba(255,217,5,.16); }
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0; background:var(--paper); color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
  display:grid; place-items:center; padding:24px; text-align:center;
  background-image:radial-gradient(60% 50% at 50% 0%,var(--glow),transparent 70%);
}
main{max-width:520px}

/* the mark: a file that drops, clips the folder and sails past it */
.mark{width:132px;height:132px;margin:0 auto 26px;display:block}
.mark svg{width:100%;height:100%;display:block;overflow:visible}
.miss{animation:miss 3s cubic-bezier(.4,0,.3,1) infinite}
@keyframes miss{
  0%,8%   {transform:translate(0,-44px) rotate(0deg);   opacity:0}
  24%     {transform:translate(0,-28px) rotate(-3deg);  opacity:1}
  50%     {transform:translate(16px,8px) rotate(17deg); opacity:1}
  76%,100%{transform:translate(52px,64px) rotate(44deg);opacity:0}
}
.lid{transform-origin:66px 120px;animation:nudge 3s cubic-bezier(.4,0,.25,1) infinite}
@keyframes nudge{0%,40%{transform:none}52%{transform:rotate(-3deg)}68%,100%{transform:none}}
@media(prefers-reduced-motion:reduce){.miss,.lid{animation:none}.miss{opacity:1}}

.code{font-size:13px;letter-spacing:.22em;text-transform:uppercase;color:var(--brand);
  font-weight:700;margin:0 0 14px}
h1{font-size:clamp(28px,5vw,38px);line-height:1.1;letter-spacing:-.025em;margin:0 0 14px;font-weight:800}
.lede{font-size:16px;line-height:1.6;color:var(--ink2);margin:0 0 30px}
.btn{display:inline-flex;align-items:center;gap:9px;padding:14px 26px;border-radius:999px;
  background:var(--brand);color:var(--on-brand);text-decoration:none;font-weight:700;font-size:15.5px;
  border:1px solid var(--brand);transition:transform .14s,box-shadow .14s}
.btn:hover{transform:translateY(-1px);box-shadow:0 10px 26px -10px rgba(255,217,5,.5)}
.btn svg{width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:2;
  stroke-linecap:round;stroke-linejoin:round}
.foot{margin-top:34px;font-size:12.5px;color:var(--ink3);letter-spacing:.01em}
.foot b{color:var(--ink2);font-weight:600}
.foot i{color:var(--brand);font-style:normal;font-weight:600}
</style>
</head>
<body>
<main>
  <span class="mark">
    <svg viewBox="0 0 44 44" aria-hidden="true">
      <path d="M3 13.5A3.5 3.5 0 0 1 6.5 10h8.1a2 2 0 0 1 1.63.84l2.2 3.06a2 2 0 0 0 1.62.84H37.5A3.5 3.5 0 0 1 41 18.24V36.5A3.5 3.5 0 0 1 37.5 40h-31A3.5 3.5 0 0 1 3 36.5z" fill="#f2994a"/>
      <rect class="lid" x="3" y="18" width="38" height="22" rx="3.6" fill="#f2c94c"/>
      <g class="miss">
        <rect x="16.5" y="2" width="11" height="13" rx="2.5" fill="#ffffff"/>
        <rect x="19" y="5.5" width="6" height="1.6" rx=".8" fill="#cfcfcf"/>
        <rect x="19" y="9" width="6" height="1.6" rx=".8" fill="#cfcfcf"/>
      </g>
    </svg>
  </span>

  <p class="code">404</p>
  <h1>This one did not land anywhere.</h1>
  <p class="lede">The page you asked for is not on this site. SORT files photos, not broken links, so let us put you back where the folders are.</p>
  <a class="btn" href="/"><svg viewBox="0 0 24 24"><path d="M19 12H5m0 0 6-6m-6 6 6 6"/></svg> Back to SORT</a>

  <p class="foot"><b>SORT</b> by <b>CDAV</b><i>.IO</i></p>
</main>
</body>
</html>
