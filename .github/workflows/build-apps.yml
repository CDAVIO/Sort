name: Build desktop apps

# Tag a release and GitHub builds both apps for you:
#   git tag v1.0.0 && git push origin v1.0.0
# Or press "Run workflow" on the Actions tab.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            name: macOS
            flag: --mac
          - os: windows-latest
            name: Windows
            flag: --win
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install build dependencies
        working-directory: electron
        run: npm install --no-audit --no-fund

      - name: Bundle index.html into the app
        working-directory: electron
        run: node build.js

      - name: Build
        working-directory: electron
        env:
          # unsigned: no Apple or Windows certificate is configured
          CSC_IDENTITY_AUTO_DISCOVERY: false
        run: npx electron-builder ${{ matrix.flag }} --publish never

      - name: Collect installers
        shell: bash
        run: |
          mkdir -p out
          find electron/dist -maxdepth 1 -type f \
            \( -name '*.dmg' -o -name '*.exe' -o -name '*.zip' \) -exec cp {} out/ \;
          ls -lh out

      - uses: actions/upload-artifact@v4
        with:
          name: SORT-${{ matrix.name }}
          path: out/*
          if-no-files-found: error

      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: out/*
          draft: false
          body: |
            SORT desktop — organize photos by device, date and place.

            **macOS**: open the `.dmg` and drag SORT to Applications. The first
            time, right-click the app and choose **Open** — the build is not
            signed with an Apple certificate, so a double-click alone is refused.

            **Windows**: run the `Setup .exe`. SmartScreen will warn that the
            publisher is unknown; choose **More info → Run anyway**. The
            `portable` build needs no install at all.

            Nothing is uploaded and no account is needed. Everything happens on
            your own machine.
